[package]
name = "cc-tbp"
version = "0.1.0"
authors = ["MinusKelvin <mark.carlson@minuskelvin.net>"]
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# TBP2 frontends play TETR.IO damage: build with `cargo build -p cc-tbp --features tetrio_garbage`.
# It isn't a default because c-api and optimizer don't compile with it, and cargo enables a feature
# for every package built together.
tetrio_garbage = ["cold-clear/tetrio_garbage", "libtetris/tetrio_garbage"]

[dependencies]
cold-clear = { path = "../bot" }
futures = "0.3.16"
libtetris = { path = "../libtetris" }
serde = { version = "1.0.124", features = ["derive"] }
serde-big-array = "0.3.2"
serde_json = "1.0.64"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.73", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4.23"
web-sys = { version = "0.3.50", features = ["DedicatedWorkerGlobalScope"] }
